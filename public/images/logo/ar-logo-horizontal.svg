<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" width="640" height="160">
  <defs>
    <!-- Emblem Background Gradient -->
    <radialGradient id="greenEmblemBg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#0E7052"/>
      <stop offset="60%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#032D22"/>
    </radialGradient>

    <!-- White & Mint Gradients -->
    <linearGradient id="whiteMintH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F2FDF8"/>
      <stop offset="100%" stop-color="#D1FAE5"/>
    </linearGradient>

    <linearGradient id="whiteSecH" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#B2F5D7"/>
    </linearGradient>

    <!-- Green Text Gradient -->
    <linearGradient id="textGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <filter id="glowH" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- Left Icon Emblem (120x120 within 160 height) -->
  <g transform="translate(16, 20)">
    <!-- Base Squircle -->
    <rect x="0" y="0" width="120" height="120" rx="30" fill="url(#greenEmblemBg)" stroke="#34D399" stroke-width="2.5"/>

    <!-- Monogram AR scaled (factor ~0.22) -->
    <g transform="translate(4, -8) scale(0.22)" filter="url(#glowH)">
      <!-- A left -->
      <path d="M 120 384 L 220 128 C 224 118, 236 112, 248 112 L 264 112 C 276 112, 288 118, 292 128 L 326 216 L 278 216 L 256 160 L 168 384 Z" fill="url(#whiteMintH)"/>
      <!-- R stem -->
      <path d="M 232 232 L 276 232 L 276 384 L 232 384 Z" fill="url(#whiteSecH)"/>
      <!-- R bowl -->
      <path d="M 276 128 L 348 128 C 396 128, 428 156, 428 200 C 428 244, 396 272, 348 272 L 276 272 Z M 276 168 L 344 168 C 370 168, 386 180, 386 200 C 386 220, 370 232, 344 232 L 276 232 Z" fill="url(#whiteMintH)"/>
      <!-- R leg -->
      <path d="M 324 256 L 396 376 C 402 386, 412 388, 424 388 L 436 388 L 358 256 Z" fill="url(#whiteMintH)"/>
      <!-- A bar -->
      <path d="M 184 292 L 276 292 L 276 324 L 171 324 Z" fill="url(#whiteSecH)"/>
      <!-- Sparkle -->
      <path d="M 408 92 C 408 108, 416 116, 432 116 C 416 116, 408 124, 408 140 C 408 124, 400 116, 384 116 C 400 116, 408 108, 408 92 Z" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Typography Right Side -->
  <g transform="translate(156, 36)">
    <!-- Main Brand Name: AR STORE -->
    <text x="0" y="44" font-family="'Inter', -apple-system, sans-serif" font-size="44" font-weight="800" letter-spacing="2">
      <tspan fill="url(#textGreen)">AR</tspan>
      <tspan fill="#064E3B" dx="8">STORE</tspan>
    </text>

    <!-- Tagline: POINT OF SALE & RETAIL SYSTEM -->
    <text x="2" y="76" font-family="'Inter', -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="4.5" fill="#059669">
      POINT OF SALE &amp; RETAIL SYSTEM
    </text>

    <!-- Decorative Bottom Accent Line -->
    <rect x="2" y="90" width="64" height="3.5" rx="1.75" fill="url(#textGreen)"/>
  </g>
</svg>

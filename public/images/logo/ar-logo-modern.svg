<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Emerald Luxury Gradient -->
    <radialGradient id="greenBg" cx="50%" cy="38%" r="68%">
      <stop offset="0%" stop-color="#0E7052"/>
      <stop offset="55%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#032D22"/>
    </radialGradient>

    <!-- Crisp White & Mint Sheen Gradient for AR Monogram -->
    <linearGradient id="whiteMint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#F2FDF8"/>
      <stop offset="80%" stop-color="#D1FAE5"/>
      <stop offset="100%" stop-color="#A7F3D0"/>
    </linearGradient>

    <linearGradient id="whiteSecondary" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E6FBF2"/>
      <stop offset="100%" stop-color="#B2F5D7"/>
    </linearGradient>

    <!-- Bright Mint Emerald Rim Border -->
    <linearGradient id="greenBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="rgba(16, 185, 129, 0.4)"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <!-- Drop Shadows & Glow -->
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#021C15" flood-opacity="0.6"/>
    </filter>
    <filter id="whiteGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Frame with Vibrant Emerald Gradient & Mint Stroke -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#greenBg)" stroke="url(#greenBorder)" stroke-width="3.5" filter="url(#softShadow)"/>

  <!-- Inner Ambient Glow Circle -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(52, 211, 153, 0.15)" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Main Monogram "AR" in Pure White & Mint Sheen -->
  <g filter="url(#whiteGlow)">
    <!-- 1. LEFT DIAGONAL OF 'A' -->
    <path d="M 120 384
             L 220 128
             C 224 118, 236 112, 248 112
             L 264 112
             C 276 112, 288 118, 292 128
             L 326 216
             L 278 216
             L 256 160
             L 168 384
             Z"
          fill="url(#whiteMint)"/>

    <!-- 2. 'R' MAIN STEM -->
    <path d="M 232 232
             L 276 232
             L 276 384
             L 232 384
             Z"
          fill="url(#whiteSecondary)"/>

    <!-- 3. 'R' UPPER ROUND BOWL -->
    <path d="M 276 128
             L 348 128
             C 396 128, 428 156, 428 200
             C 428 244, 396 272, 348 272
             L 276 272
             Z
             M 276 168
             L 344 168
             C 370 168, 386 180, 386 200
             C 386 220, 370 232, 344 232
             L 276 232
             Z"
          fill="url(#whiteMint)"/>

    <!-- 4. 'R' FORWARD DYNAMIC LEG (Retail Growth Curve) -->
    <path d="M 324 256
             L 396 376
             C 402 386, 412 388, 424 388
             L 436 388
             L 358 256
             Z"
          fill="url(#whiteMint)"/>

    <!-- 5. A-CROSSBAR / HORIZONTAL STABILIZER -->
    <path d="M 184 292
             L 276 292
             L 276 324
             L 171 324
             Z"
          fill="url(#whiteSecondary)"/>

    <!-- 6. CRISP WHITE STAR SPARKLE (Top Right Accent) -->
    <path d="M 408 92
             C 408 108, 416 116, 432 116
             C 416 116, 408 124, 408 140
             C 408 124, 400 116, 384 116
             C 400 116, 408 108, 408 92 Z"
          fill="#FFFFFF" opacity="0.95"/>
  </g>

  <!-- Brand Subtitle Tag -->
  <text x="256" y="442" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="19" font-weight="700" letter-spacing="8" fill="#FFFFFF" opacity="0.9">RETAIL POS</text>
</svg>

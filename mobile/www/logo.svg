<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E232E"/>
      <stop offset="50%" stop-color="#141821"/>
      <stop offset="100%" stop-color="#0A0C10"/>
    </linearGradient>

    <!-- Gold Metallic Gradients -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="25%" stop-color="#F6CE55"/>
      <stop offset="55%" stop-color="#D4A017"/>
      <stop offset="85%" stop-color="#A2740A"/>
      <stop offset="100%" stop-color="#DFB135"/>
    </linearGradient>

    <linearGradient id="goldSecondary" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9C6B03"/>
      <stop offset="40%" stop-color="#C99414"/>
      <stop offset="70%" stop-color="#FCD561"/>
      <stop offset="100%" stop-color="#FFEDB3"/>
    </linearGradient>

    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 237, 179, 0.6)"/>
      <stop offset="50%" stop-color="rgba(212, 160, 23, 0.2)"/>
      <stop offset="100%" stop-color="rgba(255, 237, 179, 0.5)"/>
    </linearGradient>

    <!-- Shadow filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Squircle Base with Metallic Stroke -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="url(#goldBorder)" stroke-width="4" filter="url(#shadow)"/>

  <!-- Subtle Inner Ambient Ring -->
  <rect x="36" y="36" width="440" height="440" rx="96" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="2"/>

  <!-- Geometric Monogram AR Group -->
  <g filter="url(#glow)">
    <!-- Letter A: Left Diagonal & Apex Peak -->
    <path d="M 230 118 
             C 238 106, 252 106, 260 118 
             L 282 152 
             L 214 260 
             L 165 260 
             L 224 165 
             Z" 
          fill="url(#goldLight)"/>

    <!-- Left Leg of A -->
    <path d="M 214 260 
             L 138 382 
             C 134 388, 126 392, 118 392 
             L 94 392 
             L 182 260 
             Z" 
          fill="url(#goldSecondary)"/>

    <!-- Central A-R Bridge Bar -->
    <path d="M 160 278 
             L 300 278 
             L 282 316 
             L 136 316 
             Z" 
          fill="url(#goldLight)"/>

    <!-- Letter R: Stem & Right Curve Loop -->
    <!-- R Vertical Stem -->
    <path d="M 228 155 
             L 272 155 
             L 272 392 
             L 228 392 
             Z" 
          fill="url(#goldLight)"/>

    <!-- R Upper Loop (Rounded D-Shape) -->
    <path d="M 272 155 
             L 338 155 
             C 388 155, 420 185, 420 225 
             C 420 265, 388 295, 338 295 
             L 272 295 
             Z 
             M 272 195 
             L 332 195 
             C 360 195, 376 208, 376 225 
             C 376 242, 360 255, 332 255 
             L 272 255 
             Z" 
          fill="url(#goldLight)"/>

    <!-- R Dynamic Kick Leg -->
    <path d="M 312 280 
             L 378 382 
             C 382 388, 390 392, 400 392 
             L 424 392 
             L 348 274 
             Z" 
          fill="url(#goldSecondary)"/>

    <!-- Modern Tech / Growth Star Accent at Apex -->
    <path d="M 405 105 
             L 410 120 
             L 425 125 
             L 410 130 
             L 405 145 
             L 400 130 
             L 385 125 
             L 400 120 
             Z" 
          fill="#FFF4B8" opacity="0.9"/>
  </g>
</svg>

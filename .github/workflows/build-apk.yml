name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build AR POS APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Sync Web Assets to Android Assets
        run: |
          mkdir -p mobile/android/app/src/main/assets/www
          cp -r mobile/www/* mobile/android/app/src/main/assets/www/

      - name: Initialize Gradle Wrapper
        working-directory: mobile/android
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Build APK (assembleDebug)
        working-directory: mobile/android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and Prepare APK
        run: |
          APK_PATH=$(find mobile/android/app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: File APK tidak ditemukan!"
            exit 1
          fi
          echo "APK ditemukan di: $APK_PATH"
          cp "$APK_PATH" AR-Service-POS.apk
          ls -la AR-Service-POS.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AR-Service-POS-APK
          path: AR-Service-POS.apk
          retention-days: 30

      - name: Create Release with APK (Optional on Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: AR-Service-POS.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

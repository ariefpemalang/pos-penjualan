name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build AR POS APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Mobile Assets
        run: |
          mkdir -p mobile/android/app/src/main/assets/www
          cp -r mobile/www/* mobile/android/app/src/main/assets/www/

      - name: Grant Execute Permission for Gradlew
        run: |
          cd mobile/android
          chmod +x gradlew || true

      - name: Build APK with Gradle
        run: |
          cd mobile/android
          # If gradlew wrapper is not committed, generate with gradle or install gradle
          if [ ! -f "gradlew" ]; then
            sudo apt-get install -y gradle
            gradle wrapper
            chmod +x gradlew
          fi
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk AR-Service-POS.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AR-Service-POS-APK
          path: AR-Service-POS.apk
          retention-days: 30

      - name: Create Release with APK (Optional)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: AR-Service-POS.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
